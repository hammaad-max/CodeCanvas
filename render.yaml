# Render Blueprint for TraceTables (free setup).
# - Website: Render's FREE plan (it sleeps after ~15 minutes without visitors; the next visit takes
#   about a minute to wake it up).
# - Database: a FREE PostgreSQL database on Neon (neon.tech), which does not expire. Render's own
#   free database is deleted after 30 days, so it is not used here.
# When you apply this Blueprint, Render asks for the values marked "sync: false" (see DEPLOYMENT.md).
services:
  - type: web
    name: tracetables
    runtime: docker
    dockerfilePath: ./codecanvas/Dockerfile
    dockerContext: ./codecanvas
    plan: free
    region: singapore
    healthCheckPath: /actuator/health/readiness
    autoDeploy: false
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Small, fast-starting JVM settings for the free plan's 512 MB / shared CPU
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=75 -XX:+UseSerialGC -XX:TieredStopAtLevel=1"
      # Neon database connection (from the Neon dashboard), e.g.
      #   DB_URL      = jdbc:postgresql://ep-xxxx.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
      #   DB_USERNAME = neondb_owner
      #   DB_PASSWORD = (the password Neon shows)
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Optional: public address used in password reset emails, e.g. https://tracetables.onrender.com
      - key: APP_BASE_URL
        sync: false
      # Optional: email (SMTP) for "Forgot password?" links. Leave empty to skip for now.
      - key: MAIL_FROM
        sync: false
      - key: SPRING_MAIL_HOST
        sync: false
      - key: SPRING_MAIL_PORT
        value: "587"
      - key: SPRING_MAIL_USERNAME
        sync: false
      - key: SPRING_MAIL_PASSWORD
        sync: false
      # Optional: public contact address shown in the footer and on the Privacy and Terms pages
      - key: CONTACT_EMAIL
        sync: false
