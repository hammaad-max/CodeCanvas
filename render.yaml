# Render Blueprint for the LoopLab STAGING environment.
# Creates a Docker web service and a managed PostgreSQL database, and wires the
# database credentials into the app as environment variables (no secrets in git).
# Plans are "free" for staging: the web service sleeps when idle and the free
# database expires after 30 days. Switch both to paid plans before real students use it.
services:
  - type: web
    name: looplab-staging
    runtime: docker
    dockerfilePath: ./codecanvas/Dockerfile
    dockerContext: ./codecanvas
    plan: free
    region: oregon
    healthCheckPath: /actuator/health/readiness
    autoDeploy: false
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase:
          name: looplab-staging-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: looplab-staging-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: looplab-staging-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: looplab-staging-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: looplab-staging-db
          property: password
      # Public address used in password reset emails, e.g. https://looplab-staging.onrender.com
      - key: APP_BASE_URL
        sync: false
      # Email (SMTP) for password reset links. Render asks for these values when the Blueprint is applied.
      - key: MAIL_FROM
        sync: false
      - key: SPRING_MAIL_HOST
        sync: false
      - key: SPRING_MAIL_PORT
        value: "587"
      - key: SPRING_MAIL_USERNAME
        sync: false
      - key: SPRING_MAIL_PASSWORD
        sync: false

databases:
  - name: looplab-staging-db
    databaseName: codecanvas
    user: codecanvas
    plan: free
    region: oregon
    postgresMajorVersion: "17"
