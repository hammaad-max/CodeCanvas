# Render Blueprint for LoopLab (the site students use).
# Creates a Docker web service and a managed PostgreSQL database, and wires the
# database credentials into the app as environment variables (no secrets in git).
# Paid plans: the service never sleeps, and the database has daily backups and does not expire.
# Region is Singapore (closest to students in India). The service and database must share a
# region, and Render cannot move them later.
services:
  - type: web
    name: looplab
    runtime: docker
    dockerfilePath: ./codecanvas/Dockerfile
    dockerContext: ./codecanvas
    plan: starter
    region: singapore
    healthCheckPath: /actuator/health/readiness
    autoDeploy: false
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase:
          name: looplab-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: looplab-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: looplab-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: looplab-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: looplab-db
          property: password
      # Public address used in password reset emails, e.g. https://looplab.onrender.com
      - key: APP_BASE_URL
        sync: false
      # Email (SMTP) for password reset links. Render asks for these values when the Blueprint is applied.
      - key: MAIL_FROM
        sync: false
      - key: SPRING_MAIL_HOST
        sync: false
      - key: SPRING_MAIL_PORT
        value: "587"
      - key: SPRING_MAIL_USERNAME
        sync: false
      - key: SPRING_MAIL_PASSWORD
        sync: false

databases:
  - name: looplab-db
    databaseName: codecanvas
    user: codecanvas
    plan: basic-256mb
    region: singapore
    postgresMajorVersion: "17"
