<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>CodeCanvas</title>

</head>

<body>

<h1>CodeCanvas</h1>

<h2>Student Login</h2>

<form>

    <label for="username">Username</label>

    <br>

    <input
            type="text"
            id="username"
            name="username">

    <br><br>

    <label for="password">Password</label>

    <br>

    <input
            type="password"
            id="password"
            name="password">

    <br><br>

    <button type="submit">

        Login

    </button>

</form>

</body>

</html>
