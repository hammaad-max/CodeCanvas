<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}" href="/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | TraceTables</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Plus Jakarta Sans', Arial, Helvetica, sans-serif;
            background:
                    radial-gradient(circle at 80% 0%, rgba(99, 102, 241, 0.20), transparent 35%),
                    radial-gradient(circle at 0% 30%, rgba(59, 130, 246, 0.12), transparent 30%),
                    #080b14;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background: rgba(13, 17, 30, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 44px 36px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5), 0 0 40px rgba(99, 102, 241, 0.1);
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.7px;
            margin-bottom: 8px;
            color: #ffffff;
        }

        .logo span {
            color: #818cf8;
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 32px;
            font-size: 14px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #cbd5e1;
            letter-spacing: 0.2px;
        }

        input {
            width: 100%;
            padding: 13px 16px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            background: rgba(255, 255, 255, 0.04);
            color: #ffffff;
            transition: all 0.2s ease;
        }

        input::placeholder {
            color: #64748b;
        }

        input:focus {
            outline: none;
            border-color: #818cf8;
            background: rgba(255, 255, 255, 0.07);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            font-size: 15px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.35);
            transition: all 0.2s ease;
            margin-top: 6px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 26px rgba(99, 102, 241, 0.5);
            filter: brightness(1.08);
        }

        button:active {
            transform: translateY(0);
        }

        .footer {
            text-align: center;
            margin-top: 26px;
            color: #64748b;
            font-size: 13px;
        }

        .alert {
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
            border: 1px solid;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.12);
            border-color: rgba(239, 68, 68, 0.35);
            color: #fca5a5;
        }

        .alert-ok {
            background: rgba(34, 197, 94, 0.12);
            border-color: rgba(34, 197, 94, 0.35);
            color: #86efac;
        }

        .switch-link {
            text-align: center;
            margin-top: 22px;
            color: #94a3b8;
            font-size: 14px;
        }

        .switch-link a {
            color: #818cf8;
            font-weight: 700;
            text-decoration: none;
        }

        .switch-link a:hover {
            text-decoration: underline;
        }

        .field-error {
            color: #fca5a5;
            font-size: 12px;
            font-weight: 600;
            margin: -12px 0 16px;
        }

        .help-text {
            color: #94a3b8;
            font-size: 13px;
            line-height: 1.6;
            margin: -6px 0 22px;
            text-align: center;
        }

        .section-title {
            font-size: 15px;
            font-weight: 700;
            color: #e2e8f0;
            margin: 6px 0 14px;
        }

        .divider {
            border: none;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            margin: 28px 0 22px;
        }

        .account-meta {
            text-align: center;
            color: #94a3b8;
            font-size: 13px;
            margin: -18px 0 26px;
        }

        .account-meta strong {
            color: #c7d2fe;
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="logo"><img th:src="@{/images/logo-mark.svg}" src="/images/logo-mark.svg" alt="" width="56" height="56" style="display:block;width:56px;height:56px;margin:0 auto 14px;filter:drop-shadow(0 8px 24px rgba(99,102,241,0.45));">Trace<span>Tables</span></div>

    <div class="subtitle">Choose a new password</div>

    <th:block th:if="${!validLink}">
        <div class="alert alert-error">This reset link is invalid, already used or has expired.</div>
        <div class="switch-link">
            <a href="/forgot-password">Request a new link</a> &nbsp;&middot;&nbsp; <a href="/">Back to sign in</a>
        </div>
    </th:block>

    <form th:if="${validLink}" th:action="@{/reset-password}" th:object="${form}" method="post" novalidate>
        <input type="hidden" th:field="*{token}">

        <label for="password">New password</label>
        <input type="password" id="password" name="password" placeholder="At least 8 characters"
               minlength="8" maxlength="72" autocomplete="new-password" autofocus required>
        <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>

        <label for="confirmPassword">Confirm new password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your new password"
               maxlength="72" autocomplete="new-password" required>
        <div class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>

        <button type="submit">Save new password</button>
    </form>

</div>

<script th:src="@{/js/password-toggle.js}" src="/js/password-toggle.js"></script>
</body>
</html>
