<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <meta name="student-name" th:content="${studentName}">
    <script th:src="@{/js/codecanvas-api.js}"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ICSE Java Learning Hub | CodeCanvas</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', Arial, Helvetica, sans-serif;
            background:
                    radial-gradient(circle at 80% 0%, rgba(99, 102, 241, 0.18), transparent 30%),
                    radial-gradient(circle at 0% 30%, rgba(59, 130, 246, 0.10), transparent 25%),
                    #080b14;
            color: #f8fafc;
            min-height: 100vh;
        }

        /* NAVBAR */
        .navbar {
            height: 72px;
            padding: 0 6%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(8, 11, 20, 0.82);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.7px;
            color: #ffffff;
            text-decoration: none;
        }

        .logo span {
            color: #818cf8;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-link {
            color: #94a3b8;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .nav-link:hover {
            color: #ffffff;
        }

        .profile {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            font-weight: 700;
            font-size: 14px;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.35);
        }

        /* MAIN CONTAINER */
        .container {
            width: min(1200px, 92%);
            margin: auto;
            padding: 40px 0 80px;
        }

        .page-header {
            margin-bottom: 32px;
        }

        .badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 999px;
            background: rgba(129, 140, 248, 0.12);
            border: 1px solid rgba(129, 140, 248, 0.25);
            color: #a5b4fc;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 14px;
        }

        .page-header h1 {
            font-size: 36px;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 8px;
        }

        .page-header h1 span {
            background: linear-gradient(90deg, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .page-header p {
            color: #94a3b8;
            font-size: 15px;
            max-width: 700px;
            line-height: 1.6;
        }

        /* LAYOUT: SIDEBAR + CONTENT */
        .learn-layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 32px;
            align-items: start;
        }

        /* SIDEBAR NAV */
        .unit-nav {
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 12px;
            position: sticky;
            top: 96px;
        }

        .unit-nav-title {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: #64748b;
            padding: 12px 14px 8px;
        }

        .unit-tab {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: none;
            background: transparent;
            color: #94a3b8;
            font-size: 13px;
            font-weight: 600;
            font-family: inherit;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .unit-tab:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.05);
        }

        .unit-tab.active {
            background: rgba(99, 102, 241, 0.16);
            color: #ffffff;
            border: 1px solid rgba(99, 102, 241, 0.35);
        }

        .unit-tab-num {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            padding: 3px 6px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.06);
            color: #818cf8;
            font-weight: 700;
        }

        .unit-tab.active .unit-tab-num {
            background: #6366f1;
            color: white;
        }

        /* MAIN LESSON CONTENT */
        .lesson-content {
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 38px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        .lesson-header {
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 24px;
            margin-bottom: 28px;
        }

        .lesson-unit-tag {
            font-size: 12px;
            font-weight: 700;
            color: #818cf8;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            margin-bottom: 8px;
            display: block;
        }

        .lesson-title {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.8px;
            color: #ffffff;
            margin-bottom: 12px;
        }

        .lesson-desc {
            color: #94a3b8;
            font-size: 15px;
            line-height: 1.6;
        }

        /* SECTION HEADINGS */
        .concept-section {
            margin-bottom: 32px;
        }

        .concept-section h2 {
            font-size: 19px;
            font-weight: 700;
            color: #f1f5f9;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .concept-section p, .concept-section li {
            color: #cbd5e1;
            font-size: 14.5px;
            line-height: 1.7;
            margin-bottom: 12px;
        }

        .concept-section ul {
            padding-left: 20px;
            margin-bottom: 16px;
        }

        .concept-section li {
            margin-bottom: 8px;
        }

        .concept-section strong {
            color: #ffffff;
        }

        /* CODE BOX */
        .code-box {
            background: #090d16;
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: 14px;
            padding: 18px 22px;
            margin: 16px 0 22px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13.5px;
            line-height: 1.6;
            color: #e2e8f0;
            overflow-x: auto;
        }

        .code-box .kw { color: #c084fc; font-weight: 600; }
        .code-box .typ { color: #67e8f9; font-weight: 600; }
        .code-box .str { color: #86efac; }
        .code-box .num { color: #fde047; }
        .code-box .cmt { color: #64748b; font-style: italic; }

        /* ALERT / TRAP BOX */
        .trap-box {
            background: rgba(245, 158, 11, 0.10);
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: 14px;
            padding: 18px 22px;
            margin: 20px 0;
            display: flex;
            gap: 14px;
            align-items: flex-start;
        }

        .trap-icon {
            font-size: 22px;
            line-height: 1;
        }

        .trap-content h4 {
            color: #fcd34d;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .trap-content p {
            color: #cbd5e1;
            font-size: 13.5px;
            line-height: 1.6;
            margin: 0;
        }

        /* BOTTOM ACTIONS */
        .lesson-footer {
            margin-top: 40px;
            padding-top: 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
        }

        .practice-cta-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 13px 26px;
            border-radius: 12px;
            background: linear-gradient(135deg, #6366f1, #7c3aed);
            color: white;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.3);
            transition: all 0.2s ease;
        }

        .practice-cta-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 32px rgba(99, 102, 241, 0.45);
        }

        .next-unit-btn {
            color: #94a3b8;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .next-unit-btn:hover {
            color: #ffffff;
        }

        @media (max-width: 900px) {
            .learn-layout {
                grid-template-columns: 1fr;
            }
            .unit-nav {
                position: static;
                display: flex;
                overflow-x: auto;
                padding: 8px;
                gap: 8px;
            }
            .unit-nav-title {
                display: none;
            }
            .unit-tab {
                white-space: nowrap;
                flex-shrink: 0;
                width: auto;
            }
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar">
    <a href="/dashboard" class="logo">Code<span>Canvas</span></a>
    <div class="nav-right">
        <a href="/icse" class="nav-link">← Back to ICSE Hub</a>
        <a href="/progress" class="nav-link">My Progress</a>
        <div class="profile" id="userProfileAvatar">H</div>
    </div>
</nav>

<main class="container">

    <div class="page-header">
        <div class="badge">CISCE ICSE CLASS 9 &amp; 10 • CONCEPT GUIDES</div>
        <h1>ICSE Java <span>Concept Master</span></h1>
        <p>Comprehensive, board-aligned concept summaries, syntax reference tables, standard number algorithms, and common exam traps.</p>
    </div>

    <div class="learn-layout">

        <!-- SIDEBAR TABS -->
        <aside class="unit-nav">
            <div class="unit-nav-title">Syllabus Units</div>
            <button class="unit-tab active" onclick="selectUnit(1)" id="tab-1">
                <span class="unit-tab-num">01</span> OOP &amp; Fundamentals
            </button>
            <button class="unit-tab" onclick="selectUnit(2)" id="tab-2">
                <span class="unit-tab-num">02</span> Operators &amp; Expressions
            </button>
            <button class="unit-tab" onclick="selectUnit(3)" id="tab-3">
                <span class="unit-tab-num">03</span> Branching &amp; Switch
            </button>
            <button class="unit-tab" onclick="selectUnit(4)" id="tab-4">
                <span class="unit-tab-num">04</span> Iterative Loops
            </button>
            <button class="unit-tab" onclick="selectUnit(5)" id="tab-5">
                <span class="unit-tab-num">05</span> Classic Number Programs
            </button>
            <button class="unit-tab" onclick="selectUnit(6)" id="tab-6">
                <span class="unit-tab-num">06</span> Character &amp; Strings
            </button>
            <button class="unit-tab" onclick="selectUnit(7)" id="tab-7">
                <span class="unit-tab-num">07</span> Methods &amp; Overloading
            </button>
            <button class="unit-tab" onclick="selectUnit(8)" id="tab-8">
                <span class="unit-tab-num">08</span> Arrays &amp; Sorting
            </button>
        </aside>

        <!-- DYNAMIC LESSON CONTAINER -->
        <article class="lesson-content" id="lessonContainer">
            <!-- Populated dynamically by JavaScript -->
        </article>

    </div>

</main>

<script>
    // Load student avatar (name of the signed-in account)
    try {
        const nameMeta = document.querySelector('meta[name="student-name"]');
        const studentName = nameMeta ? nameMeta.getAttribute('content') : null;
        if (studentName && studentName.trim() !== '') {
            const avatar = document.getElementById('userProfileAvatar');
            if (avatar) avatar.textContent = studentName.trim().charAt(0).toUpperCase();
        }
    } catch (e) {}

    const unitsData = {
        1: {
            tag: 'UNIT 01 • CISCE SYLLABUS',
            title: 'OOP & Java Fundamentals',
            desc: 'Understand bytecode, compilation vs interpretation in the JVM, class as an object factory, and the four fundamental pillars of Object-Oriented Programming.',
            quizTopic: 'OOP & Java Fundamentals',
            content: `
                <div class="concept-section">
                    <h2>☕ How Java Executes: javac and the JVM</h2>
                    <p>Java programs are both <strong>compiled</strong> and <strong>interpreted</strong>. This 2-stage mechanism delivers Java's hallmark: <em>"Write Once, Run Anywhere" (WORA)</em>.</p>
                    <ul>
                        <li><strong>Java Compiler (<code>javac</code>):</strong> Converts human-readable source code (<code>.java</code>) into intermediate, platform-independent <strong>Bytecode</strong> (<code>.class</code>).</li>
                        <li><strong>Java Virtual Machine (JVM):</strong> Contains an <strong>Interpreter</strong> that converts bytecode into machine-level native instructions line-by-line for the specific host OS.</li>
                    </ul>
                </div>

                <div class="concept-section">
                    <h2>🏛️ The Four Pillars of OOP</h2>
                    <ul>
                        <li><strong>Encapsulation:</strong> Wrapping data (attributes) and methods (behavior) together into a single unit (a class). Keeps internal object state protected from direct external tampering.</li>
                        <li><strong>Abstraction:</strong> Showing only essential features of an object while hiding internal complex background details.</li>
                        <li><strong>Polymorphism:</strong> The ability of an entity to take multiple forms (e.g., method overloading with different parameters).</li>
                        <li><strong>Inheritance:</strong> The mechanism by which a subclass inherits properties and methods from a superclass using the <code>extends</code> keyword.</li>
                    </ul>
                </div>

                <div class="trap-box">
                    <div class="trap-icon">⚠️</div>
                    <div class="trap-content">
                        <h4>ICSE Exam Trap: Class vs Object</h4>
                        <p>In ICSE Board theory questions: A <strong>Class</strong> is an <em>Object Factory</em> or blue-print. An <strong>Object</strong> is a concrete <em>Instance</em> of a class with state and behavior.</p>
                    </div>
                </div>
            `
        },
        2: {
            tag: 'UNIT 02 • CISCE SYLLABUS',
            title: 'Operators & Expressions',
            desc: 'Master prefix vs postfix increment/decrement (++x vs x++), operator evaluation hierarchy, type casting (implicit vs explicit), and standard java.lang.Math methods.',
            quizTopic: 'Operators & Expressions',
            content: `
                <div class="concept-section">
                    <h2>⚡ Prefix vs Postfix Evaluation</h2>
                    <p>Understanding the exact execution order is worth guaranteed marks in ICSE Section A:</p>
                    <ul>
                        <li><strong>Prefix (<code>++a</code>, <code>--a</code>):</strong> Change first, then use the new value in the expression.</li>
                        <li><strong>Postfix (<code>a++</code>, <code>a--</code>):</strong> Use the current value in the expression first, then increment/decrement afterwards.</li>
                    </ul>
                    <div class="code-box">
<span class="typ">int</span> a = <span class="num">5</span>;
<span class="typ">int</span> result = a++ + ++a;
<span class="cmt">// Step 1: a++ evaluates to 5 (a becomes 6)</span>
<span class="cmt">// Step 2: ++a increments a to 7, evaluates to 7</span>
<span class="cmt">// Result: 5 + 7 = 12 (final value of a is 7)</span>
                    </div>
                </div>

                <div class="concept-section">
                    <h2>🔄 Type Conversion &amp; Casting</h2>
                    <ul>
                        <li><strong>Implicit (Widening):</strong> Automatic conversion of smaller data types to larger ones with no data loss (e.g., <code>int</code> to <code>double</code>).</li>
                        <li><strong>Explicit (Narrowing):</strong> Manual casting using parenthesis <code>(target_type)</code>. Truncates decimal values: <code>(int) 7.9</code> yields <code>7</code>.</li>
                    </ul>
                </div>

                <div class="concept-section">
                    <h2>📐 Common Math Library Functions</h2>
                    <ul>
                        <li><code>Math.pow(2, 3)</code> &rarr; <code>8.0</code> (Always returns a <code>double</code>)</li>
                        <li><code>Math.sqrt(16)</code> &rarr; <code>4.0</code> (Always returns a <code>double</code>)</li>
                        <li><code>Math.abs(-15)</code> &rarr; <code>15</code></li>
                        <li><code>Math.round(4.6)</code> &rarr; <code>5</code> (Returns <code>long</code>/<code>int</code>)</li>
                    </ul>
                </div>
            `
        },
        3: {
            tag: 'UNIT 03 • CISCE SYLLABUS',
            title: 'Conditional Branching & Switch',
            desc: 'Construct decision-making programs using if-else ladders, ternary operator (?:), and menu-driven switch-case statements with break and default.',
            quizTopic: 'Conditional Branching & Switch',
            content: `
                <div class="concept-section">
                    <h2>🔀 The Switch-Case Statement</h2>
                    <p>The <code>switch</code> construct evaluates an expression against multiple constant <code>case</code> values:</p>
                    <div class="code-box">
<span class="typ">int</span> choice = <span class="num">2</span>;
<span class="kw">switch</span> (choice) {
    <span class="kw">case</span> <span class="num">1</span>:
        System.out.println(<span class="str">"Option 1"</span>);
        <span class="kw">break</span>;
    <span class="kw">case</span> <span class="num">2</span>:
        System.out.println(<span class="str">"Option 2"</span>);
        <span class="kw">break</span>; <span class="cmt">// If break is omitted, fall-through occurs!</span>
    <span class="kw">default</span>:
        System.out.println(<span class="str">"Invalid Option"</span>);
}
                    </div>
                </div>

                <div class="trap-box">
                    <div class="trap-icon">⚠️</div>
                    <div class="trap-content">
                        <h4>ICSE Exam Trap: Switch Expression Types</h4>
                        <p>In standard Java, switch expressions permit: <code>int</code>, <code>char</code>, <code>short</code>, <code>byte</code>, <code>String</code>, and <code>enum</code>. <strong><code>float</code> and <code>double</code> are NEVER allowed</strong> in a switch expression!</p>
                    </div>
                </div>
            `
        },
        4: {
            tag: 'UNIT 04 • CISCE SYLLABUS',
            title: 'Iterative Constructs & Loops',
            desc: 'Analyze entry-controlled loops (for, while) vs exit-controlled loops (do-while), jump statements (break, continue), and nested loops.',
            quizTopic: 'Iterative Constructs & Loops',
            content: `
                <div class="concept-section">
                    <h2>🔁 Entry-Controlled vs Exit-Controlled</h2>
                    <ul>
                        <li><strong>Entry-Controlled (<code>for</code>, <code>while</code>):</strong> Condition is checked <em>before</em> the body executes. If false initially, the loop body executes <strong>0 times</strong>.</li>
                        <li><strong>Exit-Controlled (<code>do-while</code>):</strong> Condition is checked <em>after</em> the body executes. Guaranteed to execute <strong>at least once</strong> regardless of the condition.</li>
                    </ul>
                </div>

                <div class="concept-section">
                    <h2>🛑 Jump Statements: break vs continue</h2>
                    <ul>
                        <li><code>break;</code> immediately terminates the entire enclosing loop and transfers control outside.</li>
                        <li><code>continue;</code> skips the remainder of the current iteration and jumps directly to the loop increment/condition.</li>
                    </ul>
                </div>
            `
        },
        5: {
            tag: 'UNIT 05 • CISCE SYLLABUS',
            title: 'Classic Number Programs',
            desc: 'The defining section of ICSE Class 10: digit extraction, Armstrong, Palindrome, Prime, Perfect, Automorphic, and Spy number algorithms.',
            quizTopic: 'Classic Number Programs',
            content: `
                <div class="concept-section">
                    <h2>🔢 The Universal Digit Extraction Paradigm</h2>
                    <p>Almost every ICSE Section B programming question relies on extracting digits with modulo (<code>% 10</code>) and integer division (<code>/ 10</code>):</p>
                    <div class="code-box">
<span class="typ">int</span> n = <span class="num">153</span>, temp = n, sum = <span class="num">0</span>;
<span class="kw">while</span> (temp > <span class="num">0</span>) {
    <span class="typ">int</span> digit = temp % <span class="num">10</span>;  <span class="cmt">// Extracts last digit (3, then 5, then 1)</span>
    sum += digit * digit * digit; <span class="cmt">// Sum of cubes (Armstrong check)</span>
    temp /= <span class="num">10</span>;            <span class="cmt">// Removes last digit</span>
}
<span class="kw">if</span> (sum == n) System.out.println(<span class="str">"Armstrong Number"</span>);
                    </div>
                </div>

                <div class="concept-section">
                    <h2>📋 ICSE Number Definitions Cheat-Sheet</h2>
                    <ul>
                        <li><strong>Armstrong (153):</strong> Sum of the cubes of its digits equals the number: $1^3 + 5^3 + 3^3 = 153$.</li>
                        <li><strong>Palindrome (121):</strong> A number that remains identical when its digits are reversed.</li>
                        <li><strong>Perfect Number (6, 28):</strong> Sum of all proper divisors (excluding itself) equals the number ($1 + 2 + 3 = 6$).</li>
                        <li><strong>Automorphic Number (25):</strong> Its square ends in the number itself ($25^2 = 625$).</li>
                        <li><strong>Spy Number (1124):</strong> Sum of digits equals product of digits ($1+1+2+4 = 8$ and $1\\times1\\times2\\times4 = 8$).</li>
                        <li><strong>Special / Krishnamurthy (145):</strong> Sum of factorials of digits equals number ($1! + 4! + 5! = 145$).</li>
                    </ul>
                </div>
            `
        },
        6: {
            tag: 'UNIT 06 • CISCE SYLLABUS',
            title: 'Character & String Handling',
            desc: 'Utilize Character wrapper methods, String immutability, substring extraction, lexicographical comparisons, and the Piglatin algorithm.',
            quizTopic: 'Character & String Handling',
            content: `
                <div class="concept-section">
                    <h2>🔡 Character Wrapper Methods</h2>
                    <ul>
                        <li><code>Character.isLetter(ch)</code> &rarr; <code>true</code> if 'A'-'Z' or 'a'-'z'</li>
                        <li><code>Character.isDigit(ch)</code> &rarr; <code>true</code> if '0'-'9'</li>
                        <li><code>Character.toUpperCase(ch)</code> &rarr; converts to capital letter</li>
                        <li><code>Character.isWhitespace(ch)</code> &rarr; <code>true</code> if space or newline</li>
                    </ul>
                </div>

                <div class="concept-section">
                    <h2>🧵 String Class Methods</h2>
                    <div class="code-box">
<span class="typ">String</span> s = <span class="str">"KOLKATA"</span>;
<span class="cmt">// s.charAt(0) -> 'K'</span>
<span class="cmt">// s.length() -> 7</span>
<span class="cmt">// s.substring(3, 6) -> "KAT" (indices 3, 4, 5)</span>
<span class="cmt">// s.indexOf('L') -> 2</span>
<span class="cmt">// s.compareTo("KOLKATA") -> 0 (Identical content)</span>
                    </div>
                </div>

                <div class="trap-box">
                    <div class="trap-icon">⚠️</div>
                    <div class="trap-content">
                        <h4>ICSE Exam Trap: .equals() vs ==</h4>
                        <p>Always use <code>s1.equals(s2)</code> to compare string content. The <code>==</code> operator only checks whether both references point to the exact same memory address!</p>
                    </div>
                </div>
            `
        },
        7: {
            tag: 'UNIT 07 • CISCE SYLLABUS',
            title: 'User-Defined Methods & Overloading',
            desc: 'Examine method signatures, formal vs actual parameters, pass-by-value semantics, method overloading rules, and pure vs impure functions.',
            quizTopic: 'User-Defined Methods & Overloading',
            content: `
                <div class="concept-section">
                    <h2>📝 Method Signature &amp; Overloading Rules</h2>
                    <p>In Java, a method signature consists strictly of: <strong>Method Name + Parameter Types/Order</strong>.</p>
                    <ul>
                        <li>Method Overloading allows multiple methods in the same class to share the <strong>same name</strong> provided their <strong>parameter lists differ</strong> (count, types, or order).</li>
                        <li><strong>Changing the return type alone does NOT overload a method</strong> and produces a compilation error!</li>
                    </ul>
                </div>

                <div class="concept-section">
                    <h2>🧪 Pure vs Impure Methods</h2>
                    <ul>
                        <li><strong>Pure Method:</strong> Computes and returns a result without modifying the object's instance state (no side effects).</li>
                        <li><strong>Impure Method:</strong> Alters or mutates the object's instance variables during execution.</li>
                    </ul>
                </div>
            `
        },
        8: {
            tag: 'UNIT 08 • CISCE SYLLABUS',
            title: 'Arrays, Searching & Sorting',
            desc: 'Explore 1D & 2D arrays, Linear Search, Binary Search prerequisites, Bubble Sort pass count, and diagonal matrix traversal.',
            quizTopic: 'Arrays, Searching & Sorting',
            content: `
                <div class="concept-section">
                    <h2>🔍 Linear Search vs Binary Search</h2>
                    <ul>
                        <li><strong>Linear Search:</strong> Compares target sequentially with each element from index 0 to $n-1$. Works on unsorted arrays. Time complexity is $O(n)$.</li>
                        <li><strong>Binary Search:</strong> <strong>Requires the array to be sorted</strong> in ascending/descending order. Repeatedly halves the search range. Vastly faster: $O(\\log n)$.</li>
                    </ul>
                </div>

                <div class="concept-section">
                    <h2>🫧 Bubble Sort Outer Pass Count</h2>
                    <p>For an array of $n$ elements, Bubble Sort requires exactly <strong>$n - 1$ outer passes</strong> to guarantee all elements are sorted.</p>
                </div>

                <div class="concept-section">
                    <h2>📐 2D Matrix Diagonals (N x N Matrix)</h2>
                    <ul>
                        <li><strong>Left / Principal Diagonal:</strong> Elements where row index equals column index: <code>row == col</code>.</li>
                        <li><strong>Right / Secondary Diagonal:</strong> Elements where the sum of indices equals $N - 1$: <code>row + col == N - 1</code>.</li>
                    </ul>
                </div>
            `
        }
    };

    function selectUnit(unitNum) {
        // Update active tab button
        document.querySelectorAll('.unit-tab').forEach(b => b.classList.remove('active'));
        const activeTab = document.getElementById(`tab-${unitNum}`);
        if (activeTab) activeTab.classList.add('active');

        const unit = unitsData[unitNum];
        if (!unit) return;

        const nextUnitNum = unitNum < 8 ? unitNum + 1 : 1;

        const container = document.getElementById('lessonContainer');
        container.innerHTML = `
            <div class="lesson-header">
                <span class="lesson-unit-tag">${unit.tag}</span>
                <h1 class="lesson-title">${unit.title}</h1>
                <p class="lesson-desc">${unit.desc}</p>
            </div>

            <div class="lesson-body">
                ${unit.content}
            </div>

            <div class="lesson-footer">
                <a href="/apcs/quiz?topic=${encodeURIComponent(unit.quizTopic)}&curriculum=ICSE" class="practice-cta-btn">
                    Take Unit Practice Quiz ⚡
                </a>
                <button onclick="selectUnit(${nextUnitNum})" class="next-unit-btn" style="background: none; border: none; cursor: pointer;">
                    Next Unit (${String(nextUnitNum).padStart(2, '0')}) →
                </button>
            </div>
        `;

        window.scrollTo({ top: 180, behavior: 'smooth' });
    }

    // Read ?unit= query param from URL if present
    const urlParams = new URLSearchParams(window.location.search);
    const initialUnit = parseInt(urlParams.get('unit'), 10) || 1;
    selectUnit(initialUnit);
</script>
