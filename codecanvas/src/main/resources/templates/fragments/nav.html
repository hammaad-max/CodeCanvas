<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>
<!--
  Shared top menu for every signed-in page.
  Use: <div th:replace="~{fragments/nav :: nav('dashboard')}"></div>   (active: dashboard | progress | account | course)
-->
<th:block th:fragment="nav(active)">
<style>
    .tt-nav {
        height: 72px;
        padding: 0 6%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        background: rgba(8, 11, 20, 0.85);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        position: sticky;
        top: 0;
        z-index: 50;
        font-family: 'Lexend', Arial, Helvetica, sans-serif;
        box-sizing: border-box;
    }
    .tt-nav * { box-sizing: border-box; }
    .tt-nav .tt-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.5px;
        color: #ffffff;
        text-decoration: none;
        white-space: nowrap;
    }
    .tt-nav .tt-brand img { width: 30px; height: 30px; display: block; }
    .tt-nav .tt-brand span { color: #818cf8; }
    .tt-nav .tt-links { display: flex; align-items: center; gap: 22px; }
    .tt-nav .tt-link {
        color: #94a3b8;
        text-decoration: none;
        font-family: inherit;
        font-size: 14px;
        font-weight: 500;
        white-space: nowrap;
        background: none;
        border: none;
        padding: 0;
        margin: 0;
        width: auto;
        border-radius: 0;
        box-shadow: none;
        transform: none;
        filter: none;
        cursor: pointer;
        transition: color 0.2s ease;
    }
    .tt-nav .tt-link:hover,
    .tt-nav .tt-link.active { color: #ffffff; }
    .tt-nav .tt-user { display: flex; align-items: center; gap: 10px; }
    .tt-nav .tt-name { color: #e2e8f0; font-size: 14px; font-weight: 600; white-space: nowrap; }
    .tt-nav .tt-avatar {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: #4f46e5;
        color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        font-weight: 700;
        flex-shrink: 0;
    }
    .tt-nav form { margin: 0; }
    @media (max-width: 760px) {
        .tt-nav { padding: 0 16px; }
        .tt-nav .tt-links { gap: 14px; }
        .tt-nav .tt-name,
        .tt-nav .tt-link-dashboard { display: none; }
    }
    @media (max-width: 560px) {
        .tt-nav .tt-brand-text { display: none; }
    }
</style>
<nav class="tt-nav" aria-label="Main menu">
    <a href="/dashboard" class="tt-brand" aria-label="TraceTables dashboard">
        <img th:src="@{/images/logo-mark.svg}" src="/images/logo-mark.svg" alt="" width="30" height="30">
        <span class="tt-brand-text" style="color:#ffffff">Trace<span>Tables</span></span>
    </a>
    <div class="tt-links">
        <a href="/dashboard" class="tt-link tt-link-dashboard" th:classappend="${active == 'dashboard'} ? 'active'">Dashboard</a>
        <a href="/progress" class="tt-link" th:classappend="${active == 'progress'} ? 'active'">My Progress</a>
        <a href="/account" class="tt-link" th:classappend="${active == 'account'} ? 'active'">Account</a>
        <div class="tt-user">
            <span class="tt-name" id="studentDisplayName" th:text="${studentName}">Student</span>
            <div class="tt-avatar" id="studentAvatar"
                 th:text="${studentName != null and studentName.length() > 0} ? ${#strings.toUpperCase(#strings.substring(studentName, 0, 1))} : 'S'">S</div>
        </div>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="tt-link">Log out</button>
        </form>
    </div>
</nav>
</th:block>
</body>
</html>
