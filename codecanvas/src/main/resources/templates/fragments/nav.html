<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>
<!--
  Shared top menu for every signed-in page.
  Use: <div th:replace="~{fragments/nav :: nav('dashboard')}"></div>   (active: dashboard | progress | account | course)
-->
<th:block th:fragment="nav(active)">
<style>
    .tt-nav {
        height: 56px;
        padding: 0 6%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        background: rgba(14, 19, 17, 0.7);
        backdrop-filter: blur(14px) saturate(120%);
        -webkit-backdrop-filter: blur(14px) saturate(120%);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        position: sticky;
        top: 0;
        z-index: 50;
        font-family: 'IBM Plex Sans', Arial, Helvetica, sans-serif;
        box-sizing: border-box;
    }
    .tt-nav * { box-sizing: border-box; }
    .tt-nav .tt-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 17px;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: #ffffff;
        text-decoration: none;
        white-space: nowrap;
    }
    .tt-nav .tt-brand img { width: 22px; height: 22px; display: block; }
    .tt-nav .tt-brand span { color: inherit; }
    .tt-nav .tt-links { display: flex; align-items: center; gap: 22px; }
    .tt-nav .tt-link {
        color: #8a968f;
        text-decoration: none;
        font-family: inherit;
        font-size: 14px;
        font-weight: 500;
        white-space: nowrap;
        background: none;
        border: none;
        padding: 0;
        margin: 0;
        width: auto;
        border-radius: 0;
        box-shadow: none;
        transform: none;
        filter: none;
        cursor: pointer;
        transition: color 0.2s ease;
    }
    .tt-nav .tt-link:hover,
    .tt-nav .tt-link.active { color: #ffffff; }
    .tt-nav .tt-user { display: flex; align-items: center; gap: 10px; }
    .tt-nav .tt-name { color: #d8dfda; font-size: 14px; font-weight: 600; white-space: nowrap; }
    .tt-nav .tt-avatar {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: none;
        border: 1px solid #33403a;
        color: #d8dfda;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: 500;
        font-family: 'IBM Plex Mono', Consolas, monospace;
        flex-shrink: 0;
    }
    .tt-nav form { margin: 0; }
    @media (max-width: 760px) {
        .tt-nav { padding: 0 16px; }
        .tt-nav .tt-links { gap: 14px; }
        .tt-nav .tt-name,
        .tt-nav .tt-link-dashboard { display: none; }
    }
    @media (max-width: 560px) {
        .tt-nav .tt-brand-text { display: none; }
    }
</style>
<a class="tt-skip" href="#main">Skip to content</a>
<nav class="tt-nav" aria-label="Main menu">
    <a href="/dashboard" class="tt-brand" aria-label="TraceTables dashboard">
        <img th:src="@{/images/logo-mark.svg}" src="/images/logo-mark.svg" alt="" width="22" height="22">
        <span class="tt-brand-text">TraceTables</span>
    </a>
    <div class="tt-links">
        <a href="/dashboard" class="tt-link tt-link-dashboard" th:classappend="${active == 'dashboard'} ? 'active'">Dashboard</a>
        <a href="/progress" class="tt-link" th:classappend="${active == 'progress'} ? 'active'">My Progress</a>
        <a href="/account" class="tt-link" th:classappend="${active == 'account'} ? 'active'">Account</a>
        <div class="tt-user">
            <span class="tt-name" id="studentDisplayName" th:text="${studentName}">Student</span>
            <div class="tt-avatar" id="studentAvatar"
                 th:text="${studentName != null and studentName.length() > 0} ? ${#strings.toUpperCase(#strings.substring(studentName, 0, 1))} : 'S'">S</div>
        </div>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="tt-link">Log out</button>
        </form>
    </div>
</nav>
</th:block>
</body>
</html>
