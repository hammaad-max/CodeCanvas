<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}" href="/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Practice AP CS, ICSE and ISC Java with lessons, quizzes and mock exams.">
    <meta name="theme-color" content="#0e1311">
    <link rel="manifest" th:href="@{/site.webmanifest}" href="/site.webmanifest">
    <link rel="apple-touch-icon" th:href="@{/images/apple-touch-icon.png}" href="/images/apple-touch-icon.png">

    <title>Account | TraceTables</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'IBM Plex Sans', Arial, Helvetica, sans-serif;
            background: #0e1311;
            color: #e9efeb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .login-container {
            width: 100%;
            max-width: 460px;
            background: rgba(16, 22, 20, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 44px 36px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: none;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: 600;
            letter-spacing: -0.01em;
            margin-bottom: 8px;
            color: #ffffff;
        }

        .logo span {
            color: #5fd38d;
        }

        .subtitle {
            text-align: center;
            color: #8a968f;
            margin-bottom: 32px;
            font-size: 14px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #b9c3bd;
            letter-spacing: 0.2px;
        }

        input {
            width: 100%;
            padding: 13px 16px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
            background: rgba(255, 255, 255, 0.04);
            color: #ffffff;
            transition: all 0.2s ease;
        }

        input::placeholder {
            color: #6f7b75;
        }

        input:focus {
            outline: none;
            border-color: #5fd38d;
            background: rgba(255, 255, 255, 0.07);
            box-shadow: none;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 4px;
            background: #5fd38d;
            color: #06200f;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            box-shadow: none;
            transition: all 0.2s ease;
            margin-top: 6px;
        }

        button:hover {
            box-shadow: none;
            filter: brightness(1.08);
        }

        button:active {
            transform: translateY(0);
        }

        .footer {
            text-align: center;
            margin-top: 26px;
            color: #6f7b75;
            font-size: 13px;
        }

        .alert {
            padding: 12px 14px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
            border: 1px solid;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.12);
            border-color: rgba(239, 68, 68, 0.35);
            color: #fca5a5;
        }

        .alert-ok {
            background: rgba(34, 197, 94, 0.12);
            border-color: rgba(34, 197, 94, 0.35);
            color: #86efac;
        }

        .switch-link {
            text-align: center;
            margin-top: 22px;
            color: #8a968f;
            font-size: 14px;
        }

        .switch-link a {
            color: #5fd38d;
            font-weight: 600;
            text-decoration: none;
        }

        .switch-link a:hover {
            text-decoration: underline;
        }

        .field-error {
            color: #fca5a5;
            font-size: 12px;
            font-weight: 600;
            margin: -12px 0 16px;
        }

        .help-text {
            color: #8a968f;
            font-size: 13px;
            line-height: 1.6;
            margin: -6px 0 22px;
            text-align: center;
        }

        .section-title {
            font-size: 15px;
            font-weight: 600;
            color: #d8dfda;
            margin: 6px 0 14px;
        }

        .divider {
            border: none;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            margin: 28px 0 22px;
        }

        .account-meta {
            text-align: center;
            color: #8a968f;
            font-size: 13px;
            margin: -18px 0 26px;
        }

        .account-meta strong {
            color: #b5ecc9;
        }
    </style>
    <link rel="stylesheet" th:href="@{/css/theme.css}" href="/css/theme.css">
</head>

<body>

<div class="login-container">

    <div class="logo"><img th:src="@{/images/logo-mark.svg}" src="/images/logo-mark.svg" alt="" width="56" height="56" style="display:block;width:56px;height:56px;margin:0 auto 14px;">Trace<span>Tables</span></div>

    <div class="subtitle">Account settings</div>
    <div class="account-meta">Signed in as <strong th:text="${username}">username</strong></div>

    <div class="alert alert-ok" th:if="${param.emailSaved != null}">Email address saved.</div>
    <div class="alert alert-ok" th:if="${param.passwordSaved != null}">Password changed.</div>
    <div class="alert alert-error" th:if="${!hasEmail}">
        Add your email address so you can reset your password if you forget it.
    </div>

    <div class="section-title">Email address</div>
    <form th:action="@{/account/email}" th:object="${emailForm}" method="post" novalidate>
        <label for="email">Email</label>
        <input type="email" id="email" th:field="*{email}" placeholder="you@example.com"
               maxlength="254" autocomplete="email" required>
        <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        <button type="submit">Save email</button>
    </form>

    <hr class="divider">

    <div class="section-title">Change password</div>
    <form th:action="@{/account/password}" th:object="${passwordForm}" method="post" novalidate>
        <label for="currentPassword">Current password</label>
        <input type="password" id="currentPassword" name="currentPassword" maxlength="72"
               autocomplete="current-password" required>
        <div class="field-error" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"></div>

        <label for="newPassword">New password</label>
        <input type="password" id="newPassword" name="password" placeholder="At least 8 characters"
               minlength="8" maxlength="72" autocomplete="new-password" required>
        <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>

        <label for="confirmNewPassword">Confirm new password</label>
        <input type="password" id="confirmNewPassword" name="confirmPassword" maxlength="72"
               autocomplete="new-password" required>
        <div class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>

        <button type="submit">Change password</button>
    </form>

    <div class="switch-link">
        <a href="/dashboard">&larr; Back to Dashboard</a>
    </div>

</div>

<script th:src="@{/js/password-toggle.js}" src="/js/password-toggle.js"></script>
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
