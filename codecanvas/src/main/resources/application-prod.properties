# Production / staging profile. Activate with SPRING_PROFILES_ACTIVE=prod.
# Required environment variables: DB_URL, DB_USERNAME, DB_PASSWORD. Optional: PORT (default 8080).

server.port=${PORT:8080}

# ---------- Templates & static files ----------
spring.thymeleaf.cache=true
spring.web.resources.cache.cachecontrol.max-age=7d
spring.web.resources.cache.cachecontrol.cache-public=true
# Content-hashed URLs (/js/codecanvas-api-<hash>.js) so a new release is never served from a stale cache
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
server.compression.enabled=true

# ---------- HTTPS behind a reverse proxy / load balancer ----------
# TLS is terminated by the proxy (Caddy, nginx, cloud load balancer); trust its X-Forwarded-* headers
# so redirects, secure cookies and HSTS use https.
server.forward-headers-strategy=native
server.servlet.session.cookie.secure=true

# ---------- Database ----------
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=10000
# Never allow Flyway to wipe the database
spring.flyway.clean-disabled=true

# ---------- Lifecycle ----------
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# ---------- Logging ----------
# One JSON object per line on stdout (ECS format) so the hosting platform can collect and search logs.
logging.structured.format.console=ecs
logging.level.root=INFO
logging.level.com.hammaad.codecanvas=INFO
logging.level.org.springframework.security=WARN
