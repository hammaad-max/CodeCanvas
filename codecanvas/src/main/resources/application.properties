spring.application.name=TraceTables

# Local secrets: values in ./.env (gitignored) are loaded if the file exists.
# In staging/production set the DB_* values as real environment variables instead.
spring.config.import=optional:file:.env[.properties]

# ---------- Database (PostgreSQL) ----------
# Either set DB_URL (full JDBC URL), or DB_HOST / DB_PORT / DB_NAME (used by managed platforms such as Render).
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:codecanvas}}
spring.datasource.username=${DB_USERNAME:codecanvas}
# No default on purpose: the app refuses to start without a password from the environment.
spring.datasource.password=${DB_PASSWORD}

# Schema is owned by Flyway migrations (src/main/resources/db/migration); Hibernate only validates it.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ---------- Email (password reset links) ----------
# SMTP server: set SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD in the environment.
# Without SPRING_MAIL_HOST no email is sent (in dev the reset link is written to the log instead).
tracetables.mail.from=${MAIL_FROM:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# Public address used in emailed links, e.g. https://tracetables.onrender.com (recommended in production).
tracetables.base-url=${APP_BASE_URL:}
# Public contact address shown in the footer and legal pages. Leave empty to show none.
tracetables.contact-email=${CONTACT_EMAIL:}

# ---------- Sessions ----------
# Longer than the 90-minute mock exam so students are not logged out mid-exam.
server.servlet.session.timeout=120m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie

# ---------- Health check ----------
# Only /actuator/health is exposed (public, status only: UP/DOWN, includes the database check).
# /actuator/health/liveness and /actuator/health/readiness are available for load balancers / orchestrators.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db

# ---------- Errors: never leak stack traces or exception messages ----------
server.error.include-stacktrace=never
server.error.include-message=never

# ---------- Development conveniences ----------
# Disable Thymeleaf template caching for instant UI reload during development
spring.thymeleaf.cache=false

# Spring Boot DevTools live reload configuration
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
