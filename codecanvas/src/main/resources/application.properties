spring.application.name=CodeCanvas

# Local secrets: values in ./.env (gitignored) are loaded if the file exists.
# In staging/production set DB_URL, DB_USERNAME and DB_PASSWORD as real environment variables instead.
spring.config.import=optional:file:.env[.properties]

# ---------- Database (PostgreSQL) ----------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/codecanvas}
spring.datasource.username=${DB_USERNAME:codecanvas}
# No default on purpose: the app refuses to start without a password from the environment.
spring.datasource.password=${DB_PASSWORD}

# Schema is owned by Flyway migrations (src/main/resources/db/migration); Hibernate only validates it.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ---------- Sessions ----------
# Longer than the 90-minute mock exam so students are not logged out mid-exam.
server.servlet.session.timeout=120m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie

# ---------- Errors: never leak stack traces or exception messages ----------
server.error.include-stacktrace=never
server.error.include-message=never

# ---------- Development conveniences ----------
# Disable Thymeleaf template caching for instant UI reload during development
spring.thymeleaf.cache=false

# Spring Boot DevTools live reload configuration
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
