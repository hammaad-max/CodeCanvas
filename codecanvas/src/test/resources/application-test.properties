# Tests run against in-memory H2 in PostgreSQL compatibility mode, using the same Flyway migrations.
spring.datasource.url=jdbc:h2:mem:codecanvas;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false
